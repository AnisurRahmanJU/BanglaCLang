<style>
textarea.code-area {
	background-color: #272822;
	color: #f8f8f2;
	font-family: 'Courier New', Courier, monospace;
	border: 1px solid #444;
	padding: 10px;
	width: 80%;
	min-height: 200px;
	font-size: 16px;
	resize: vertical;
}

/* Converted C Code Area */
.converted-code-wrapper {
	background-color: #272822;
	color: #f8f8f2;
	font-family: 'Courier New', Courier, monospace;
	width: 80%;
	height: 300px;
	overflow: auto;
	border: 1px solid #444;
	padding: 10px;
	box-sizing: border-box;
}
.converted-code-wrapper pre {
	margin: 0;
	font-size: 16px;
}

#convertedCode {
	white-space: pre-wrap;  /* VERY IMPORTANT */
	word-wrap: break-word;
}

</style>
