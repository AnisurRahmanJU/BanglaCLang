<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>বাংলা➝সি কোড</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- PrismJS (C Language Support with Line Numbers) -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/line-numbers/prism-line-numbers.min.css" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/line-numbers/prism-line-numbers.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-c.min.js"></script>

  <!-- Styles -->
  <link rel="stylesheet" href="styles.css" />
</head>

<body style="background-color: #333; color: white">
  <center>
    <h1 style="color: lightblue;">বাংলা➝সি কোড</h1>
  </center>

  <br />

  <!-- Bangla Code Input -->
  <label class="banglaCode">Enter Bangla Code:</label>
  <div class="textarea-wrapper">
    <div class="line-numbers-wrapper" id="lineNumbers">১</div>
    <div class="textarea-scroll-wrapper">
      <textarea
        id="banglaCode"
        placeholder="Enter your Bangla code here..."
        class="code-area"
        oninput="updateLineNumbers()"
        onscroll="syncScroll()"
      ></textarea>
    </div>
  </div>

  <button onclick="convertToC()" class="c-convert">Convert to C Code</button>

  <!-- Converted Code Display -->
  <div class="code-container">
    <h2>Converted C Code:</h2>
    <button onclick="copyToClipboard()" class="copy-button">
      📋<span style="color: black">Copy Code</span>
    </button>
  </div>

  <div class="converted-code-wrapper">
    <pre class="line-numbers"><code id="convertedCode" class="language-c"></code></pre>
  </div>

  <!-- External Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

  <!-- Online Compiler Links -->
  <div class="run-buttons">
    <span style="font-weight: bold; font-size: 20px;">▶️ Run by:</span>
    <a href="https://www.programiz.com/c-programming/online-compiler/" target="_blank" class="c-convert">Programiz</a>
    <a href="https://www.w3schools.com/c/tryc.php?filename=demo_compiler" target="_blank" class="c-convert">W3Schools</a>
  </div>

  <a href="https://github.com/AnisurRahmanJU/BanglaCLang/blob/main/bn_code-examples.md" target="_blank" class="c-convert">📖 Documentation</a>
  <a href="https://github.com/AnisurRahmanJU/" target="_blank" class="c-convert">👤 About Me</a>

  <!-- Scripts -->
  <script>
    function updateLineNumbers() {
      const textarea = document.getElementById("banglaCode");
      const lineNumbers = document.getElementById("lineNumbers");
      const lines = textarea.value.split("\n").length;

      // Convert English digits to Bengali digits
      function toBengaliDigit(num) {
        const bengaliDigits = ['০', '১', '২', '৩', '৪', '৫', '৬', '৭', '৮', '৯'];
        return String(num).split('').map(d => bengaliDigits[parseInt(d)]).join('');
      }

      lineNumbers.innerHTML = Array.from({ length: lines }, (_, i) => toBengaliDigit(i + 1)).join("<br>");
      syncScroll();
    }

    function syncScroll() {
      const textarea = document.getElementById("banglaCode");
      const lineNumbers = document.getElementById("lineNumbers");
      lineNumbers.scrollTop = textarea.scrollTop;
    }

    function convertToC() {
      const input = document.getElementById("banglaCode").value;
      const output = document.getElementById("convertedCode");
      output.textContent = "// Converted C Code\n" + input; // Dummy conversion
      Prism.highlightAll();
    }

    function copyToClipboard() {
      const code = document.getElementById("convertedCode").textContent;
      navigator.clipboard.writeText(code).then(() => alert("Code copied to clipboard!"));
    }

    document.addEventListener("DOMContentLoaded", updateLineNumbers);
  </script>
  <script src="script.js"></script>
</body>

</html>
