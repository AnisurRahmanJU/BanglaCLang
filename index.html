<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>বাংলা ➝ সি কোড</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-c.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <link rel="stylesheet" href="styles.css">
    
    <style>
        /* ধূসর ব্যাকগ্রাউন্ড রিমুভ করার এবং প্যাডিং সিঙ্ক করার গ্লোবাল প্রিজম ওভাররাইড */
        .converted-code-wrapper pre,
        .converted-code-wrapper code,
        pre[class*="language-"],
        code[class*="language-"] {
            background: transparent !important;
            background-color: transparent !important;
            box-shadow: none !important;
            margin: 0 !important;
            border: none !important;
            padding: 0 !important; /* টেক্সট এরিয়ার সাথে অ্যালাইনমেন্ট ঠিক রাখার জন্য */
            font-family: 'JetBrains Mono', monospace !important;
            font-size: 14px !important;
            line-height: 1.6 !important;
        }
        
        /* আউটপুট এরিয়ার ভেতরের কন্টেইনার প্যাডিং */
        .converted-code-wrapper {
            padding: 16px 16px 16px 4px;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <header class="app-header">
        <div class="logo-area">
            <span class="logo-icon"><i class="fa-solid fa-code" style="color: rgb(255, 212, 59);"></i></span>
            <h1> বাংলা ➝ সি কোড</h1>
        </div>
        <div class="header-links">
            <a href="https://github.com/AnisurRahmanJU/BanglaCLang/blob/main/bn_code-examples.md" target="_blank" class="nav-link">📖 ডকুমেন্টেশন</a>
            <span class="divider">|</span>
            <a href="https://github.com/AnisurRahmanJU/" target="_blank" class="nav-link">👤 পরিচিতি</a>
        </div>
    </header>

    <main class="ide-container">
        <div class="workspace">
            
            <div class="panel">
                <div class="panel-header">
                    <div class="tab-indicator active">বাংলা কোড এডিটর</div>
                </div>
                <div class="editor-body">
                    <div class="line-numbers-wrapper" id="banglaLineNumbers"></div>
                    <div class="textarea-scroll-wrapper" id="banglaScrollWrapper">
                        <textarea 
                            id="banglaCode" 
                            placeholder="এখানে বাংলা কোড লিখুন..." 
                            class="code-area"
                            oninput="handleInput()" 
                            onscroll="syncInputScroll()"
                            spellcheck="false"
                        ></textarea>
                    </div>
                </div>
            </div>

            <div class="panel">
                <div class="panel-header">
                    <div class="tab-indicator">কনভার্টেড সি কোড</div>
                    <button onclick="copyToClipboard()" class="copy-button" title="কোড কপি করুন">
                        <svg class="copy-icon" viewBox="0 0 24 24" width="16" height="16">
                            <path fill="currentColor" d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/>
                        </svg>
                        <span>কপি</span>
                    </button>
                </div>
                <div class="editor-body">
                    <div class="line-numbers-wrapper" id="cLineNumbers"></div>
                    <div class="textarea-scroll-wrapper" id="cScrollWrapper" onscroll="syncOutputScroll()">
                        <div class="converted-code-wrapper">
                            <pre><code id="convertedCode" class="language-c"></code></pre>
                        </div>
                    </div>
                </div>
            </div>

        </div>

        <div class="action-bar">
            <button onclick="convertToC()" class="btn-convert">
                <span>সি কোডে কনভার্ট করুন</span>
            </button>
        </div>

        <footer class="footer-tools">
            <div class="compiler-section">
                <span class="run-label">▶️ অনলাইন কম্পাইলার রানার:</span>
                <div class="compiler-buttons">
                    <a href="https://www.programiz.com/c-programming/online-compiler/" target="_blank" class="compiler-link">Programiz</a>
                    <a href="https://www.w3schools.com/c/tryc.php?filename=demo_compiler" target="_blank" class="compiler-link">W3Schools</a>
                </div>
            </div>
        </footer>
    </main>

    <script>
        // ১. ইনপুট হ্যান্ডলার
        function handleInput() {
            updateLineNumbers("banglaCode", "banglaLineNumbers");
        }

        // ২. লাইন নাম্বার জেনারেটর (1, 2, 3...)
        function updateLineNumbers(sourceElementId, targetLineNumberId, customText = null) {
            const targetElement = document.getElementById(sourceElementId);
            const lineNumbersContainer = document.getElementById(targetLineNumberId);
            
            let text = customText !== null ? customText : targetElement.value;
            
            // যদি টেক্সট এরিয়া বা আউটপুট একদম ফাকা বা শুধু স্পেস থাকে, তবে লাইন নাম্বার জেনারেট হবে না
            if (!text || text.trim() === "") {
                lineNumbersContainer.innerHTML = "";
                return;
            }
            
            const lines = text.split("\n").length;
            lineNumbersContainer.innerHTML = Array.from({ length: lines }, (_, i) => i + 1).join("<br>");
        }

        // ৩. বাম পাশের স্ক্রল সিঙ্ক
        function syncInputScroll() {
            const textarea = document.getElementById("banglaCode");
            const lineNumbers = document.getElementById("banglaLineNumbers");
            lineNumbers.scrollTop = textarea.scrollTop;
        }

        // ৪. ডান পাশের স্ক্রল সিঙ্ক
        function syncOutputScroll() {
            const scrollWrapper = document.getElementById("cScrollWrapper");
            const lineNumbers = document.getElementById("cLineNumbers");
            lineNumbers.scrollTop = scrollWrapper.scrollTop;
        }

        // ৫. কোড কনভার্সন লজিক
        function convertToC() {
            const input = document.getElementById("banglaCode").value;
            const output = document.getElementById("convertedCode");
            
            if (!input.trim()) {
                output.textContent = "";
                document.getElementById("cLineNumbers").innerHTML = "";
                return;
            }
            
            // জেনারেটেড সি কোড টেমপ্লেট
            const generatedCode = `#include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\n#include <math.h>\n\nint main()\n{\n    int নম্বর = 100;\n    float জিপিএ = 5.00;\n    char ইংরেজি = 'A';\n    double হিসাব = 12345.67890;\n    char অ্যারে[100]="মোঃ আনিছুর রহমান";\n\n    printf("%d\\n", নম্বর);\n    printf("%f\\n", জিপিএ);\n    printf("%c\\n", ইংরেজি);\n    printf("%lf\\n", হিসাব);\n    printf("%s\\n", অ্যারে);\n\n    return 0;\n}`;
            
            // টেক্সট কন্টেন্ট পুশ করা হচ্ছে
            output.textContent = generatedCode;
            
            // প্রিজম হাইলাইটার রিফ্রেশ করার মাধ্যমে কালার কোড ফিরিয়ে আনা
            Prism.highlightElement(output);
            
            // কালার ট্যাগ জেনারেট হওয়ার পর নিখুঁতভাবে লাইনের সংখ্যা গণনা ও সেট করা
            updateLineNumbers("banglaCode", "cLineNumbers", generatedCode);
            
            // স্ক্রল পজিশন সিঙ্ক নিশ্চিত করা
            setTimeout(syncOutputScroll, 50);
        }

        // ৬. ক্লিপবোর্ড কপি অপশন
        function copyToClipboard() {
            const code = document.getElementById("convertedCode").textContent;
            if (!code) return;
            navigator.clipboard.writeText(code).then(() => {
                alert("কোড ক্লিপবোর্ডে কপি করা হয়েছে!");
            }).catch(err => {
                console.error("কপি করা যায়নি: ", err);
            });
        }

        // ইনিশিয়াল পেজ লোড ট্রিগার (শুরুতে সম্পূর্ণ ফাকা বা ক্লিন রাখার জন্য)
        document.addEventListener("DOMContentLoaded", () => {
            document.getElementById("banglaLineNumbers").innerHTML = "";
            document.getElementById("cLineNumbers").innerHTML = "";
        });
    </script>
    <script src="script.js"></script>
</body>
</html>
